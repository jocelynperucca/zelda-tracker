<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- ===== Screen 1: Choose a game ===== -->
  <text x="20" y="28" font-size="13" fill="#888">Screen 1 — Game select</text>
  <rect x="20" y="40" width="300" height="460" rx="10" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <text x="40" y="78" font-size="20" font-weight="bold" fill="#222">Choose a game</text>
  <text x="300" y="78" font-size="12" fill="#666" text-anchor="end">jocelyn ▾</text>

  <!-- card 1 -->
  <rect x="40" y="100" width="260" height="110" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="52" y="112" width="60" height="86" fill="#e3e3e3" stroke="#999"/>
  <line x1="52" y1="112" x2="112" y2="198" stroke="#999"/>
  <line x1="112" y1="112" x2="52" y2="198" stroke="#999"/>
  <text x="124" y="132" font-size="15" font-weight="bold" fill="#222">Ocarina of Time</text>
  <text x="124" y="152" font-size="12" fill="#666">1998 · N64</text>
  <rect x="124" y="170" width="160" height="10" rx="5" fill="#e3e3e3"/>
  <rect x="124" y="170" width="72" height="10" rx="5" fill="#4a9a5c"/>
  <text x="124" y="196" font-size="11" fill="#444">54 / 120 items · 45%</text>

  <!-- card 2 -->
  <rect x="40" y="226" width="260" height="110" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="52" y="238" width="60" height="86" fill="#e3e3e3" stroke="#999"/>
  <line x1="52" y1="238" x2="112" y2="324" stroke="#999"/>
  <line x1="112" y1="238" x2="52" y2="324" stroke="#999"/>
  <text x="124" y="258" font-size="15" font-weight="bold" fill="#222">Game #2</text>
  <text x="124" y="278" font-size="12" fill="#666">year · console</text>
  <rect x="124" y="296" width="160" height="10" rx="5" fill="#e3e3e3"/>
  <rect x="124" y="296" width="16" height="10" rx="5" fill="#4a9a5c"/>
  <text x="124" y="322" font-size="11" fill="#444">10 / 100 items · 10%</text>

  <text x="170" y="380" font-size="12" fill="#888" text-anchor="middle" font-style="italic">click a game → loads its checklist</text>

  <!-- arrow between screens -->
  <line x1="300" y1="155" x2="350" y2="155" stroke="#4a9a5c" stroke-width="2.5"/>
  <polygon points="350,149 362,155 350,161" fill="#4a9a5c"/>

  <!-- ===== Screen 2: Checklist ===== -->
  <text x="370" y="28" font-size="13" fill="#888">Screen 2 — Item checklist</text>
  <rect x="370" y="40" width="570" height="460" rx="10" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <text x="390" y="78" font-size="20" font-weight="bold" fill="#222">← Ocarina of Time</text>
  <rect x="650" y="62" width="120" height="24" rx="4" fill="#fff" stroke="#888"/>
  <text x="660" y="79" font-size="12" fill="#444">Type: All ▾</text>
  <text x="920" y="78" font-size="12" fill="#666" text-anchor="end">jocelyn ▾</text>

  <!-- location group 1 -->
  <text x="390" y="118" font-size="14" font-weight="bold" fill="#333">▾ Kakariko Village</text>
  <line x1="390" y1="126" x2="720" y2="126" stroke="#ccc"/>
  <g font-size="13" fill="#222">
    <rect x="400" y="138" width="14" height="14" rx="2" fill="#4a9a5c" stroke="#4a9a5c"/>
    <path d="M403 145 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="424" y="150">Heart Piece – Windmill</text>
    <rect x="400" y="164" width="14" height="14" rx="2" fill="#fff" stroke="#555"/>
    <text x="424" y="176">Heart Piece – Bottom of the Well</text>
    <rect x="400" y="190" width="14" height="14" rx="2" fill="#4a9a5c" stroke="#4a9a5c"/>
    <path d="M403 197 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="424" y="202">Bottle – Cucco Lady</text>
  </g>

  <!-- location group 2 -->
  <text x="390" y="242" font-size="14" font-weight="bold" fill="#333">▾ Lake Hylia</text>
  <line x1="390" y1="250" x2="720" y2="250" stroke="#ccc"/>
  <g font-size="13" fill="#222">
    <rect x="400" y="262" width="14" height="14" rx="2" fill="#fff" stroke="#555"/>
    <text x="424" y="274">Heart Piece – Lab roof</text>
    <rect x="400" y="288" width="14" height="14" rx="2" fill="#4a9a5c" stroke="#4a9a5c"/>
    <path d="M403 295 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="424" y="300">Fire Arrows</text>
  </g>

  <!-- location group 3 (collapsed) -->
  <text x="390" y="340" font-size="14" font-weight="bold" fill="#333">▸ Water Temple</text>
  <line x1="390" y1="348" x2="720" y2="348" stroke="#ccc"/>
  <text x="390" y="378" font-size="14" font-weight="bold" fill="#333">▸ Death Mountain</text>
  <line x1="390" y1="386" x2="720" y2="386" stroke="#ccc"/>

  <text x="390" y="430" font-size="12" fill="#888" font-style="italic">click a box → saved to the database instantly</text>

  <!-- counters sidebar -->
  <rect x="740" y="104" width="180" height="230" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="756" y="128" font-size="14" font-weight="bold" fill="#222">Progress</text>
  <g font-size="12" fill="#333">
    <text x="756" y="156">Heart Pieces</text>
    <text x="904" y="156" text-anchor="end">12 / 36</text>
    <rect x="756" y="162" width="148" height="8" rx="4" fill="#e3e3e3"/>
    <rect x="756" y="162" width="49" height="8" rx="4" fill="#d9534f"/>

    <text x="756" y="194">Bottles</text>
    <text x="904" y="194" text-anchor="end">2 / 4</text>
    <rect x="756" y="200" width="148" height="8" rx="4" fill="#e3e3e3"/>
    <rect x="756" y="200" width="74" height="8" rx="4" fill="#5b8dd9"/>

    <text x="756" y="232">Key Items</text>
    <text x="904" y="232" text-anchor="end">18 / 30</text>
    <rect x="756" y="238" width="148" height="8" rx="4" fill="#e3e3e3"/>
    <rect x="756" y="238" width="89" height="8" rx="4" fill="#d9a441"/>

    <line x1="756" y1="262" x2="904" y2="262" stroke="#ddd"/>
    <text x="756" y="290" font-weight="bold">Overall</text>
    <text x="904" y="290" text-anchor="end" font-weight="bold">54 / 120</text>
    <rect x="756" y="298" width="148" height="10" rx="5" fill="#e3e3e3"/>
    <rect x="756" y="298" width="67" height="10" rx="5" fill="#4a9a5c"/>
  </g>
</svg>
